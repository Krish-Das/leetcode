[project]
name = "lcpy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Krish-Das", email = "krishdasatgames@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
lcpy = "lcpy:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.5",
]

[tool.ruff]
line-length = 80
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
